name: Branch CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            local-demand-survey/package-lock.json

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          npm ci
          npm ci --prefix local-demand-survey

      - name: Run Python verification
        run: |
          python -m pytest -q
          python -m compileall -q main.py login_main.py setup_login.py src
          python tools/sanity_check.py
          python -m pip check

      - name: Run Node verification
        run: |
          npm test
          npm audit --omit=dev

      - name: Run demand survey verification
        run: |
          npm run lint --prefix local-demand-survey
          npm test --prefix local-demand-survey
          npm run build --prefix local-demand-survey
          npm audit --omit=dev --prefix local-demand-survey
