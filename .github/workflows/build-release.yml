name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (optional, e.g., v3.0.3). Empty = auto next version."
        required: false
        type: string
      bump:
        description: "Auto version bump when version is empty"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      run_live_auth_smoke:
        description: "Create an isolated live trial account and run the authentication GUI smoke"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies (locked + hashed)
        shell: bash
        run: |
          pip install --require-hashes -r requirements.lock
          npm ci

      - name: Run automated tests
        run: |
          python -m pytest -q
          node --test tests_js/*.test.mjs

      - name: Get version
        id: get_version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version || '' }}
          RELEASE_BUMP_INPUT: ${{ inputs.bump || 'patch' }}
        run: |
          if [[ -n "$RELEASE_VERSION_INPUT" && ! "$RELEASE_VERSION_INPUT" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid explicit version format"
            exit 1
          fi
          if [[ ! "$RELEASE_BUMP_INPUT" =~ ^(patch|minor|major)$ ]]; then
            echo "Invalid bump value"
            exit 1
          fi
          VERSION="$(python .github/scripts/next_version.py \
            --explicit "$RELEASE_VERSION_INPUT" \
            --ref "${GITHUB_REF}" \
            --bump "$RELEASE_BUMP_INPUT")"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Validate release version
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Run explicitly approved live authentication GUI smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_auth_smoke }}
        shell: pwsh
        timeout-minutes: 5
        run: |
          & "tools\live_auth_gui_smoke.ps1" -HoldSeconds 5

      - name: Sync version in source files
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          python .github/scripts/set_version.py "$VERSION"
          grep "VERSION =" main.py
          grep "VERSION =" login_main.py

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          COUPUAS_TRUSTED_SIGNER_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          python build_exe.py

      - name: Sign executable with configured pinned certificate
        shell: pwsh
        timeout-minutes: 5
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/sign-windows-artifact.ps1" `
            -Path "dist\CoupangThreadAuto.exe" `
            -AllowPinnedSelfSigned

      - name: Verify executable release signature
        shell: pwsh
        env:
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/assert-public-authenticode.ps1" `
            -Path "dist\CoupangThreadAuto.exe" `
            -ExpectedThumbprint $env:CODE_SIGN_CERT_THUMBPRINT `
            -AllowPinnedSelfSigned

      - name: Launch signed packaged login window
        shell: pwsh
        timeout-minutes: 2
        run: |
          & "tools\packaged_gui_smoke.ps1" `
            -ExePath "dist\CoupangThreadAuto.exe" `
            -TimeoutSeconds 60

      - name: Verify build
        run: |
          if (Test-Path "dist\\CoupangThreadAuto.exe") {
            Write-Host "Build successful!"
            $size = (Get-Item "dist\\CoupangThreadAuto.exe").Length / 1MB
            Write-Host "File size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Build failed - EXE not found"
            exit 1
          }

      - name: Verify packaged Windows child processes stay hidden
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "coupuas-window-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          python -m PyInstaller --onefile --windowed --clean --noconfirm `
            --name CoupangThreadAutoWindowsSmoke `
            --distpath $smokeRoot `
            --workpath (Join-Path $smokeRoot "build") `
            --specpath $smokeRoot `
            --paths . `
            tools/windows_child_process_smoke.py
          $resultPath = Join-Path $smokeRoot "result.json"
          $before = Get-Process conhost,cmd,icacls,whoami,tasklist,WerFault -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Id
          $process = Start-Process `
            -FilePath (Join-Path $smokeRoot "CoupangThreadAutoWindowsSmoke.exe") `
            -ArgumentList @($resultPath) `
            -WindowStyle Hidden `
            -PassThru
          $visible = @()
          $deadline = (Get-Date).AddSeconds(60)
          while (-not $process.HasExited) {
            if ((Get-Date) -ge $deadline) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged Windows child-process smoke timed out."
            }
            $visible += Get-Process conhost,cmd,icacls,whoami,tasklist,WerFault -ErrorAction SilentlyContinue |
              Where-Object { $_.Id -notin $before -and $_.MainWindowHandle -ne 0 }
            Start-Sleep -Milliseconds 25
            $process.Refresh()
          }
          if ($process.ExitCode -ne 0) {
            Get-Content $resultPath -ErrorAction SilentlyContinue
            throw "Packaged Windows child-process smoke failed with exit code $($process.ExitCode)"
          }
          if ($visible) {
            $visible | Sort-Object Id -Unique | Format-Table -AutoSize
            throw "A child console window was visible during the packaged smoke test."
          }
          $result = Get-Content -Raw $resultPath | ConvertFrom-Json
          if (-not $result.frozen -or -not $result.passed) {
            Get-Content $resultPath
            throw "Packaged Windows child-process assertions failed."
          }

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash "dist\\CoupangThreadAuto.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash CoupangThreadAuto.exe" | Out-File -FilePath "dist\\CoupangThreadAuto.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Locate Inno Setup
        shell: pwsh
        timeout-minutes: 5
        run: |
          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"),
            (Join-Path $env:RUNNER_TEMP "Inno Setup 6\ISCC.exe")
          )
          $isccPath = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1

          if (-not $isccPath) {
            Write-Warning "The runner image does not include Inno Setup. Using the verified immutable upstream release."
            $installerPath = Join-Path $env:RUNNER_TEMP "innosetup-6.6.1.exe"
            $portableToolDir = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
            $installLogPath = Join-Path $env:RUNNER_TEMP "innosetup-6.6.1-install.log"
            $downloadUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_6_1/innosetup-6.6.1.exe"
            $expectedHash = "d243ce440c02705530699554fb9612b9b2bd7a2a90629cdb7f41e66f5faeb91f"
            Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath
            $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "Inno Setup installer checksum mismatch."
            }

            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $installerPath
            $startInfo.UseShellExecute = $false
            foreach ($argument in @(
              "/PORTABLE=1",
              "/SILENT",
              "/CURRENTUSER",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              "/DIR=$portableToolDir",
              "/LOG=$installLogPath"
            )) {
              [void]$startInfo.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::Start($startInfo)
            if (-not $process.WaitForExit(120000)) {
              $process.Kill($true)
              throw "Inno Setup fallback installation timed out."
            }
            if ($process.ExitCode -notin 0, 1641, 3010) {
              if (Test-Path -LiteralPath $installLogPath) {
                Get-Content -LiteralPath $installLogPath -Tail 100
              }
              throw "Inno Setup fallback installation failed with exit code $($process.ExitCode)."
            }
            $isccPath = Join-Path $portableToolDir "ISCC.exe"
          }

          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "ISCC.exe was not found."
          }
          Write-Host "Using Inno Setup compiler: $isccPath"
          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $global:LASTEXITCODE = 0

      - name: Build installer
        env:
          COUPUAS_APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          python build_installer.py

      - name: Sign installer with configured pinned certificate
        shell: pwsh
        timeout-minutes: 5
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/sign-windows-artifact.ps1" `
            -Path "dist\CoupangThreadAutoSetup.exe" `
            -AllowPinnedSelfSigned

      - name: Verify installer release signature
        shell: pwsh
        env:
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/assert-public-authenticode.ps1" `
            -Path "dist\CoupangThreadAutoSetup.exe" `
            -ExpectedThumbprint $env:CODE_SIGN_CERT_THUMBPRINT `
            -AllowPinnedSelfSigned

      - name: Verify installer
        run: |
          if (Test-Path "dist\\CoupangThreadAutoSetup.exe") {
            Write-Host "Installer build successful!"
            $size = (Get-Item "dist\\CoupangThreadAutoSetup.exe").Length / 1MB
            Write-Host "Installer size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Installer build failed - setup EXE not found"
            exit 1
          }

      - name: Generate installer checksum
        run: |
          $hash = (Get-FileHash "dist\\CoupangThreadAutoSetup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash CoupangThreadAutoSetup.exe" | Out-File -FilePath "dist\\CoupangThreadAutoSetup.exe.sha256" -Encoding ascii
          Write-Host "Installer SHA256: $hash"

      - name: Generate release metadata
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $ownerRepo = "${{ github.repository }}"
          $metadata = [ordered]@{
            version = $version
            installer = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAutoSetup.exe"
            installer_sha256 = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAutoSetup.exe.sha256"
            standalone_exe = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAuto.exe"
            standalone_exe_sha256 = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAuto.exe.sha256"
          }
          $metadata | ConvertTo-Json -Depth 3 | Out-File -FilePath "dist\\latest.json" -Encoding utf8

      - name: Generate release notes
        shell: bash
        run: |
          python .github/scripts/release_notes.py \
            --version "${{ steps.get_version.outputs.VERSION }}" \
            --output "dist/RELEASE_NOTES.md"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CoupangThreadAuto-release
          path: |
            dist/CoupangThreadAuto.exe
            dist/CoupangThreadAuto.exe.sha256
            dist/CoupangThreadAutoSetup.exe
            dist/CoupangThreadAutoSetup.exe.sha256
            dist/latest.json
            dist/RELEASE_NOTES.md
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CoupangThreadAuto-release
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Thread Auto ${{ needs.build.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/CoupangThreadAuto.exe
            dist/CoupangThreadAuto.exe.sha256
            dist/CoupangThreadAutoSetup.exe
            dist/CoupangThreadAutoSetup.exe.sha256
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify search engines with IndexNow
        shell: bash
        continue-on-error: true
        env:
          INDEXNOW_KEY: 31d40a5ce9c84f0f9f1f386ca9f96df6
          SITE_URL: https://coupuas-thread-auto-ten.vercel.app
        run: |
          payload="$(jq -nc \
            --arg host "coupuas-thread-auto-ten.vercel.app" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$SITE_URL/$INDEXNOW_KEY.txt" \
            --arg home "$SITE_URL/" \
            --arg notices "$SITE_URL/notices" \
            --arg terms "$SITE_URL/terms" \
            --arg privacy "$SITE_URL/privacy" \
            --arg refund "$SITE_URL/refund" \
            --arg support "$SITE_URL/support" \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:[$home,$notices,$terms,$privacy,$refund,$support]}')"
          status="$(curl --silent --show-error --output indexnow-response.txt \
            --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")"
          if [[ "$status" != "200" && "$status" != "202" ]]; then
            echo "IndexNow submission returned HTTP $status"
            cat indexnow-response.txt
            exit 1
          fi
          echo "IndexNow accepted the release URLs (HTTP $status)."
