name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
    paths:
      - "src/**"
      - "main.py"
      - "login_main.py"
      - "requirements.lock"
      - "build_exe.py"
      - "build_installer.py"
      - "installer/**"
      - ".github/workflows/build-release.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (optional, e.g., v3.0.3). Empty = auto next version."
        required: false
        type: string
      bump:
        description: "Auto version bump when version is empty"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (locked + hashed)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          python -m playwright install chromium

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION="$(python .github/scripts/next_version.py \
            --explicit "${{ inputs.version || '' }}" \
            --ref "${GITHUB_REF}" \
            --bump "${{ inputs.bump || 'patch' }}")"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Validate release version
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Sync version in source files
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          python .github/scripts/set_version.py "$VERSION"
          grep "VERSION =" main.py
          grep "VERSION =" login_main.py

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          COUPUAS_TRUSTED_SIGNER_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          python build_exe.py

      - name: Sign executable
        shell: pwsh
        timeout-minutes: 5
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/sign-windows-artifact.ps1" -Path "dist\CoupangThreadAuto.exe"

      - name: Verify build
        run: |
          if (Test-Path "dist\\CoupangThreadAuto.exe") {
            Write-Host "Build successful!"
            $size = (Get-Item "dist\\CoupangThreadAuto.exe").Length / 1MB
            Write-Host "File size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Build failed - EXE not found"
            exit 1
          }

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash "dist\\CoupangThreadAuto.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash CoupangThreadAuto.exe" | Out-File -FilePath "dist\\CoupangThreadAuto.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        env:
          COUPUAS_APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          python build_installer.py

      - name: Sign installer
        shell: pwsh
        timeout-minutes: 5
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/sign-windows-artifact.ps1" -Path "dist\CoupangThreadAutoSetup.exe"

      - name: Verify installer
        run: |
          if (Test-Path "dist\\CoupangThreadAutoSetup.exe") {
            Write-Host "Installer build successful!"
            $size = (Get-Item "dist\\CoupangThreadAutoSetup.exe").Length / 1MB
            Write-Host "Installer size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Installer build failed - setup EXE not found"
            exit 1
          }

      - name: Generate installer checksum
        run: |
          $hash = (Get-FileHash "dist\\CoupangThreadAutoSetup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash CoupangThreadAutoSetup.exe" | Out-File -FilePath "dist\\CoupangThreadAutoSetup.exe.sha256" -Encoding ascii
          Write-Host "Installer SHA256: $hash"

      - name: Generate release metadata
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $ownerRepo = "${{ github.repository }}"
          $metadata = [ordered]@{
            version = $version
            installer = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAutoSetup.exe"
            installer_sha256 = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAutoSetup.exe.sha256"
            standalone_exe = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAuto.exe"
            standalone_exe_sha256 = "https://github.com/$ownerRepo/releases/latest/download/CoupangThreadAuto.exe.sha256"
          }
          $metadata | ConvertTo-Json -Depth 3 | Out-File -FilePath "dist\\latest.json" -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CoupangThreadAuto-release
          path: |
            dist/CoupangThreadAuto.exe
            dist/CoupangThreadAuto.exe.sha256
            dist/CoupangThreadAutoSetup.exe
            dist/CoupangThreadAutoSetup.exe.sha256
            dist/latest.json
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CoupangThreadAuto-release
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            서버 관리형 AI와 다중 Threads 계정 자동화를 추가한 버전입니다.

            ### 주요 변경 사항
            - 별도 AI API 키 없이 로그인과 이용권만으로 네 가지 Threads 문안을 생성합니다.
            - 상품 타깃과 사용 장면을 분석해 후킹 본문과 상품 답글을 분리 생성합니다.
            - 계정별 브라우저 프로필, 대기열, 업로드 이력 및 재개 상태를 지원합니다.
            - xAI 우선 생성과 제한된 장애 대체 경로, Vercel 상태 확인 API를 추가했습니다.

            Windows 사용자는 설치형 파일을 받으면 됩니다.
            - 설치형: `CoupangThreadAutoSetup.exe`
            - 단독 실행형: `CoupangThreadAuto.exe`
            - 각 파일의 SHA-256 체크섬을 함께 제공합니다.
          draft: false
          prerelease: false
          files: |
            dist/CoupangThreadAuto.exe
            dist/CoupangThreadAuto.exe.sha256
            dist/CoupangThreadAutoSetup.exe
            dist/CoupangThreadAutoSetup.exe.sha256
            dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Thread Genius website
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: Kimchanghee/thread-genius
          event-type: new-release
          client-payload: >-
            {
              "tag_name": "${{ needs.build.outputs.version }}",
              "release_name": "Release ${{ needs.build.outputs.version }}",
              "body": "서버 관리형 AI와 다중 Threads 계정 자동화: 별도 AI API 키 없이 네 가지 문안을 생성하고 계정별 대기열과 업로드 이력을 관리합니다.",
              "installer_url": "https://github.com/Kimchanghee/coupuas-thread-auto/releases/latest/download/CoupangThreadAutoSetup.exe",
              "standalone_url": "https://github.com/Kimchanghee/coupuas-thread-auto/releases/latest/download/CoupangThreadAuto.exe",
              "metadata_url": "https://github.com/Kimchanghee/coupuas-thread-auto/releases/latest/download/latest.json"
            }
