name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v2.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (locked + hashed)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          python -m playwright install chromium

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Validate release version
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Update version in main.py
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -i 's/VERSION = ".*"/VERSION = "'$VERSION'"/' main.py
          echo "Updated version to $VERSION"
          grep "VERSION =" main.py

      - name: Build executable
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          COUPUAS_TRUSTED_SIGNER_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          python build_exe.py

      - name: Sign executable
        shell: pwsh
        timeout-minutes: 5
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/sign-windows-artifact.ps1" -Path "dist\CoupangThreadAuto.exe"

      - name: Verify build
        run: |
          if (Test-Path "dist\\CoupangThreadAuto.exe") {
            Write-Host "Build successful!"
            $size = (Get-Item "dist\\CoupangThreadAuto.exe").Length / 1MB
            Write-Host "File size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Build failed - EXE not found"
            exit 1
          }

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash "dist\\CoupangThreadAuto.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash CoupangThreadAuto.exe" | Out-File -FilePath "dist\\CoupangThreadAuto.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        env:
          COUPUAS_APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
        run: |
          python build_installer.py

      - name: Sign installer
        shell: pwsh
        timeout-minutes: 5
        env:
          WINDOWS_CODE_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_CERT_BASE64 }}
          WINDOWS_CODE_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
        run: |
          & ".github/scripts/sign-windows-artifact.ps1" -Path "dist\CoupangThreadAutoSetup.exe"

      - name: Verify installer
        run: |
          if (Test-Path "dist\\CoupangThreadAutoSetup.exe") {
            Write-Host "Installer build successful!"
            $size = (Get-Item "dist\\CoupangThreadAutoSetup.exe").Length / 1MB
            Write-Host "Installer size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Error "Installer build failed - setup EXE not found"
            exit 1
          }

      - name: Generate installer checksum
        run: |
          $hash = (Get-FileHash "dist\\CoupangThreadAutoSetup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash CoupangThreadAutoSetup.exe" | Out-File -FilePath "dist\\CoupangThreadAutoSetup.exe.sha256" -Encoding ascii
          Write-Host "Installer SHA256: $hash"

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CoupangThreadAuto-release
          path: |
            dist/CoupangThreadAuto.exe
            dist/CoupangThreadAuto.exe.sha256
            dist/CoupangThreadAutoSetup.exe
            dist/CoupangThreadAutoSetup.exe.sha256
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: CoupangThreadAuto-release
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            새로운 버전이 출시되었습니다.
          draft: false
          prerelease: false
          files: |
            dist/CoupangThreadAuto.exe
            dist/CoupangThreadAuto.exe.sha256
            dist/CoupangThreadAutoSetup.exe
            dist/CoupangThreadAutoSetup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
