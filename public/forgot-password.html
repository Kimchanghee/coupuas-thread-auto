<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>비밀번호 재설정 · 스레드 파일럿</title>
    <link rel="stylesheet" href="/password-reset.css" />
    <script src="/password-reset.js" defer></script>
  </head>
  <body data-recovery-page="request">
    <main class="recovery-shell">
      <section class="brand-panel" aria-label="스레드 파일럿">
        <div class="brand-mark">THREAD PILOT</div>
        <div>
          <h1>안전하게 계정을 복구하세요.</h1>
          <p>상품 링크에서 게시까지 이어지는 자동화 작업은 그대로 보존됩니다.</p>
        </div>
        <div class="brand-foot">보안 링크 · 30분 유효 · 1회 사용</div>
      </section>
      <section class="recovery-card">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h2>비밀번호를 잊으셨나요?</h2>
        <p class="intro">가입할 때 사용한 아이디 또는 이메일을 입력하세요. 계정이 확인되면 재설정 링크를 보내드립니다.</p>
        <form id="recovery-form" method="post" action="/api/password-reset/request" novalidate>
          <div class="field">
            <label for="identifier">아이디 또는 이메일</label>
            <input id="identifier" name="identifier" type="text" autocomplete="username" minlength="3" maxlength="255" required autofocus />
            <p class="hint">보안을 위해 계정 존재 여부는 화면에 표시하지 않습니다.</p>
          </div>
          <button id="submit-button" type="submit">재설정 메일 받기</button>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <a class="back-link" href="/">홈으로 돌아가기</a>
      </section>
    </main>
  </body>
</html>
