<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coupuas Thread Auto</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e5e7eb;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      main {
        width: min(680px, 100%);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.1;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 17px;
        line-height: 1.7;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        color: #86efac;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #22c55e;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status"><span class="dot"></span>Desktop app repository</div>
      <h1>Coupuas Thread Auto</h1>
      <p>
        This Vercel deployment is a static status page for the desktop automation repository.
        The Windows application runs locally and is not a Vercel serverless Python app.
      </p>
    </main>
  </body>
</html>
