<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>새 비밀번호 설정 · Thread Auto</title>
    <link rel="stylesheet" href="/password-reset.css" />
    <script type="module" src="/password-reset.js"></script>
  </head>
  <body data-recovery-page="confirm">
    <main class="recovery-shell">
      <section class="brand-panel" aria-label="Thread Auto">
        <div class="brand-mark">THREAD AUTO</div>
        <div>
          <h1>새 비밀번호로 다시 시작하세요.</h1>
          <p>변경이 완료되면 기존 로그인 세션은 모두 안전하게 종료됩니다.</p>
        </div>
        <div class="brand-foot">변경 후 앱에서 다시 로그인하세요</div>
      </section>
      <section class="recovery-card">
        <p class="eyebrow">SECURE RESET</p>
        <h2>새 비밀번호 설정</h2>
        <p class="intro">영문자와 숫자를 포함해 15자 이상 입력하세요.</p>
        <form id="recovery-form" method="post" action="/api/password-reset/confirm" novalidate>
          <div class="field">
            <label for="password">새 비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required autofocus />
          </div>
          <div class="field">
            <label for="password-confirm">새 비밀번호 확인</label>
            <input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="15" maxlength="128" required />
            <p class="hint">다른 서비스에서 사용하지 않는 비밀번호를 권장합니다.</p>
          </div>
          <button id="submit-button" type="submit">비밀번호 변경</button>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <section id="recovery-next" class="recovery-next" tabindex="-1" hidden><h3>앱에서 로그인하세요</h3><p>열려 있는 Thread Auto 앱으로 돌아가 새 비밀번호를 입력하세요. 이 페이지에서 다시 변경할 필요는 없습니다.</p><a class="back-link" href="/#workflow">앱 다운로드 · 설치 안내</a></section>
        <a class="back-link" href="/forgot-password">새 링크 요청하기</a>
      </section>
    </main>
  </body>
</html>
