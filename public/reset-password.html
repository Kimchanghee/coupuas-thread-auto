<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>새 비밀번호 설정 · 스레드 파일럿</title>
    <link rel="stylesheet" href="/password-reset.css" />
    <script src="/password-reset.js" defer></script>
  </head>
  <body data-recovery-page="confirm">
    <main class="recovery-shell">
      <section class="brand-panel" aria-label="스레드 파일럿">
        <div class="brand-mark">THREAD PILOT</div>
        <div>
          <h1>새 비밀번호로 다시 시작하세요.</h1>
          <p>변경이 완료되면 기존 로그인 세션은 모두 안전하게 종료됩니다.</p>
        </div>
        <div class="brand-foot">bcrypt 보호 · 기존 세션 자동 폐기</div>
      </section>
      <section class="recovery-card">
        <p class="eyebrow">SECURE RESET</p>
        <h2>새 비밀번호 설정</h2>
        <p class="intro">영문자와 숫자를 포함해 8자 이상 입력하세요.</p>
        <form id="recovery-form" method="post" action="/api/password-reset/confirm" novalidate>
          <div class="field">
            <label for="password">새 비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required autofocus />
          </div>
          <div class="field">
            <label for="password-confirm">새 비밀번호 확인</label>
            <input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
            <p class="hint">다른 서비스에서 사용하지 않는 비밀번호를 권장합니다.</p>
          </div>
          <button id="submit-button" type="submit">비밀번호 변경</button>
        </form>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <a class="back-link" href="/forgot-password">새 링크 요청하기</a>
      </section>
    </main>
  </body>
</html>
